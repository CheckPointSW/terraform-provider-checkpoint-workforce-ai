name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Vet
    runs-on: checkpointsw-scaleset
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  integration:
    name: Integration Tests
    runs-on: checkpointsw-scaleset
    needs: build
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    env:
      CHECKPOINT_INFINITY_CLIENT_ID: ${{ secrets.CHECKPOINT_INFINITY_CLIENT_ID }}
      CHECKPOINT_INFINITY_ACCESS_KEY: ${{ secrets.CHECKPOINT_INFINITY_ACCESS_KEY }}
      CHECKPOINT_INFINITY_REGION: ${{ secrets.CHECKPOINT_INFINITY_REGION }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: Check secrets available
        id: secrets-check
        run: |
          if [ -z "$CHECKPOINT_INFINITY_CLIENT_ID" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping integration tests — secrets not configured"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run integration tests
        if: steps.secrets-check.outputs.available == 'true'
        run: go test -v -timeout 5m ./tests/
        env:
          CHECKPOINT_INFINITY_CLIENT_ID: ${{ secrets.CHECKPOINT_INFINITY_CLIENT_ID }}
          CHECKPOINT_INFINITY_ACCESS_KEY: ${{ secrets.CHECKPOINT_INFINITY_ACCESS_KEY }}
          CHECKPOINT_INFINITY_REGION: ${{ secrets.CHECKPOINT_INFINITY_REGION }}
